name: Deploy Both Versions to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build Website
        working-directory: ./website
        run: |
          npm install
          npm run build

      - name: Assemble Production Site
        run: |
          mkdir -p combined_pages
          # Production site at root
          cp -r website/dist/* combined_pages/
          # Redirect / mirror for historical links /v1/ and /v2/
          mkdir -p combined_pages/v1
          cp -r website/dist/* combined_pages/v1/
          mkdir -p combined_pages/v2
          cp -r website/dist/* combined_pages/v2/
          # SPA 404 fallback
          cp website/dist/index.html combined_pages/404.html
          touch combined_pages/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./combined_pages

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
