<?xml version="1.0" encoding="utf-8"?>
<svg version="1.1" id="Solution_Print_Logo_White" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 280">
  <style>
    .logo-white { fill: #FFFFFF; }
