    .logo-teal { fill: #2A9D8F; }
    .text-title-white {
      fill: #FFFFFF;
      font-family: 'Plus Jakarta Sans', 'Inter', 'Montserrat', sans-serif;
      font-size: 64px;
      font-weight: 800;
      letter-spacing: 0.16em;
    }
    .text-sub-gold {
      fill: #E9C46A;
      font-family: 'Plus Jakarta Sans', 'Inter', 'Montserrat', sans-serif;
      font-size: 34px;
      font-weight: 700;
      letter-spacing: 0.38em;
    }
  </style>

  <!-- Roof with Chimney -->
  <path class="logo-white" d="M361.5,83.9l-30.8-25.2V21.6c0-1.5-1.9-2.8-4.3-2.8h-18.3c-2.4,0-4.3,1.3-4.3,2.8v15.2l-30.6-25.1L260.8,1.6
    c-2.2-2.1-5.8-2.1-8,0l-88.2,72.2l-12.4,10.1c-5.6,4.6,2.4,12.5,8,8l88.2-72.2l8.4-6.9l84.3,68.9l12.4,10.1
    C359,96.4,367,88.5,361.5,83.9z"/>

  <!-- Windows (Teal & Amber) -->
  <rect x="244.8" y="76.4" class="logo-teal" width="9.5" height="9.5" rx="1"/>
  <rect x="244.8" y="62.5" class="logo-teal" width="9.5" height="9.5" rx="1"/>
  <rect x="259.3" y="76.4" class="logo-accent" width="9.5" height="9.5" rx="1"/>
  <rect x="259.3" y="62.5" class="logo-accent" width="9.5" height="9.5" rx="1"/>

  <!-- Text СОЛЮШН -->
  <text x="268" y="162" text-anchor="middle" class="text-title-white">СОЛЮШН</text>

