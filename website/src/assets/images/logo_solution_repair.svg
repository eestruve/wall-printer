<?xml version="1.0" encoding="utf-8"?>
<svg version="1.1" id="Solution_Repair_Logo" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 280">
  <style>
    .logo-main { fill: #181818; }
    .logo-accent { fill: #FCEA0E; }
    .logo-window-yellow { fill: #FCEA0E; }
    .logo-window-red { fill: #E30613; }
    .text-title {
      fill: #181818;
      font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 56px;
      font-weight: 900;
      letter-spacing: 0.14em;
    }
    .text-sub {
      fill: #181818;
      font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 30px;
      font-weight: 800;
      letter-spacing: 0.55em;
    }
    @media (prefers-color-scheme: dark) {
      .logo-main, .text-title, .text-sub { fill: #FFFFFF; }
    }
  </style>

  <!-- Крыша с дымоходом -->
  <path class="logo-main" d="M361.5,83.9l-30.8-25.2V21.6c0-1.5-1.9-2.8-4.3-2.8h-18.3c-2.4,0-4.3,1.3-4.3,2.8v15.2l-30.6-25.1L260.8,1.6
    c-2.2-2.1-5.8-2.1-8,0l-88.2,72.2l-12.4,10.1c-5.6,4.6,2.4,12.5,8,8l88.2-72.2l8.4-6.9l84.3,68.9l12.4,10.1
    C359,96.4,367,88.5,361.5,83.9z"/>

  <!-- 4 окна: 3 желтые (#FCEA0E), а правая верхняя (#E30613) красная в цвет кнопок сайта -->
  <rect x="244.8" y="62.5" class="logo-window-yellow" width="9.5" height="9.5" rx="1"/>
  <rect x="244.8" y="76.4" class="logo-window-yellow" width="9.5" height="9.5" rx="1"/>
  <rect x="259.3" y="76.4" class="logo-window-yellow" width="9.5" height="9.5" rx="1"/>
  <rect x="259.3" y="62.5" class="logo-window-red" width="9.5" height="9.5" rx="1"/>

  <!-- Текст СОЛЮШИН -->
  <text x="268" y="162" text-anchor="middle" class="text-title">СОЛЮШИН</text>

  <!-- Разделитель -->
  <path class="logo-accent" d="M365,180H155c-4,0-4,5,0,5h210C369,185,369,180,365,180z"/>

  <!-- Дескриптор: РЕМОНТ -->
  <text x="268" y="226" text-anchor="middle" class="text-sub">РЕМОНТ</text>
</svg>
